name: Build Windows Executable (.exe)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Standalone MiTramiteJusto.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and PyInstaller dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run unit tests before packaging
        run: pytest -v

      - name: Build Windows executable with PyInstaller
        run: pyinstaller --clean --noconfirm MiTramiteJusto.spec

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi-tramite-justo-windows-exe
          path: dist/MiTramiteJusto.exe
