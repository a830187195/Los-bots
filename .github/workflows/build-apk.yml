name: Build Android APK (Mi Trámite Justo)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality-and-tests:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow cryptography pytest ruff mypy

      - name: Run linter (ruff)
        run: ruff check src tests scripts main.py

      - name: Run unit tests (pytest)
        run: pytest -v

      - name: Build and verify .mtjpack bundles
        run: python scripts/build_packs.py

      - name: Upload .mtjpack CDN artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtjpack-bundles
          path: dist_packs/*.mtjpack

  build-android-apk:
    name: Build Installable Android APK
    needs: quality-and-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android Buildozer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev lld

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Cache Buildozer global and local directories
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Compile Android Debug APK
        run: |
          yes | buildozer android debug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-tramite-justo-apk
          path: bin/*.apk
