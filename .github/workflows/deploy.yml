name: Deploy Web PWA to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-prepare:
    name: Test Python Core & Prepare Static Site
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow cryptography pytest ruff

      - name: Run linter & tests
        run: |
          ruff check src tests scripts main.py
          pytest -v

      - name: Assemble static GitHub Pages bundle
        run: |
          mkdir -p _site
          cp index.html styles.css app.js manifest.webmanifest sw.js .nojekyll _site/
          mkdir -p _site/assets
          cp -r assets/* _site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: verify-and-prepare
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
